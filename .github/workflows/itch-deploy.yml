name: Deploy to itch.io

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to itch.io with butler
        uses: josephbmanley/butler-publish-itchio@master
        with:
          butler-version: latest
          game-owner: badar-rehman
          game-name: fruitpile
          itch-channel: html5
          files: dist
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
